<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEO Remover - Diagnostic Edition</title>
<script src="https://unpkg.com/mp4-muxer@latest/build/mp4-muxer.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070a;--s1:#0f0f14;--s2:#16161e;--text:#f0f0f8;--muted:#6b6b85;
  --accent:#7c6dfa;--green:#22d3a0;--red:#f87171;--r:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;padding:40px 20px;max-width:800px;margin:0 auto}
.header{margin-bottom:30px;text-align:center}
.logo{font-size:24px;font-weight:800;letter-spacing:-1px}
.logo span{color:var(--accent)}
.drop-zone{border:2px dashed #ffffff15;border-radius:var(--r);padding:40px;text-align:center;cursor:pointer;background:var(--s1);margin-bottom:20px;display:block}
.drop-zone:hover{border-color:var(--accent)}
#file-input{display:none}
.controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:20px}
.btn{font-family:inherit;font-weight:700;padding:12px 24px;border-radius:10px;border:none;cursor:pointer;transition:0.2s}
.btn-p{background:var(--accent);color:white}
.btn-p:disabled{opacity:0.3;cursor:not-allowed}
.gp-wrap{background:var(--s1);padding:20px;border-radius:var(--r);margin-bottom:20px;display:none;border:1px solid #ffffff10}
.gp-bar{height:6px;background:#000;border-radius:3px;margin:10px 0;overflow:hidden}
.gp-fill{height:100%;background:var(--accent);width:0%;transition:0.1s}
.log{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:10px;white-space:pre-wrap}
.err-msg{color:var(--red);background:#f8717110;padding:10px;border-radius:8px;margin-bottom:15px;display:none;font-size:13px;border:1px solid #f8717130}
.file-list{display:flex;flex-direction:column;gap:8px}
.file-item{background:var(--s1);padding:12px;border-radius:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<div class="header">
  <div class="logo">VEO <span>DIAGNOSTIC</span></div>
  <p style="color:var(--muted);font-size:12px;margin-top:5px">Versione con tracciamento errori hardware</p>
</div>

<div id="support-alert" class="err-msg" style="display:block; background:#7c6dfa10; color:var(--accent); border-color:var(--accent)">
  Verifica compatibilità browser in corso...
</div>

<label class="drop-zone" id="drop-zone">
  <div style="font-weight:700">Carica o trascina i video</div>
  <div style="font-size:12px;color:var(--muted)">MP4 o MOV (Max 10MB consigliati)</div>
  <input type="file" id="file-input" accept="video/*" multiple>
</label>

<div class="controls">
  <div style="background:var(--s1);padding:10px;border-radius:10px;display:flex;align-items:center;gap:10px">
    <span style="font-size:12px;color:var(--muted)">ZOOM</span>
    <input type="range" id="zoom-slider" min="105" max="130" value="110">
  </div>
  <button class="btn btn-p" id="start-btn">AVVIA PROCESSO</button>
</div>

<div id="error-display" class="err-msg"></div>

<div class="gp-wrap" id="gp-wrap">
  <div style="display:flex;justify-content:space-between;font-size:13px">
    <span id="gp-label">Pronto</span>
    <span id="gp-pct">0%</span>
  </div>
  <div class="gp-bar"><div class="gp-fill" id="gp-fill"></div></div>
  <div class="log" id="gp-log">Inizializzazione...</div>
</div>

<div class="file-list" id="file-list"></div>

<canvas id="canvas" style="display:none"></canvas>
<video id="video" style="display:none" muted playsinline></video>

<script>
const $=id=>document.getElementById(id);
const video=$('video');
const canvas=$('canvas');
const ctx=canvas.getContext('2d',{alpha:false});
let files=[];

// 1. VERIFICA COMPATIBILITÀ IMMEDIATA
if (!window.VideoEncoder || !window.VideoFrame) {
  $('support-alert').innerHTML = "⚠️ <b>Errore Fatale:</b> Il tuo browser non supporta 'WebCodecs'. Usa <b>Chrome, Edge o Opera</b> (aggiornati) per far funzionare questo tool.";
  $('support-alert').style.color = "var(--red)";
  $('start-btn').disabled = true;
} else {
  $('support-alert').innerHTML = "✅ Browser compatibile (Chrome/Edge Engine)";
  setTimeout(()=>$('support-alert').style.display='none', 3000);
}

$('file-input').onchange=e=>addFiles(e.target.files);
$('drop-zone').ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};
$('drop-zone').ondragover=e=>e.preventDefault();

function addFiles(list){
  Array.from(list).forEach(f=>{
    files.push({file:f, id:Math.random().toString(36).substr(2,9)});
  });
  render();
}

function render(){
  $('file-list').innerHTML=files.map(f=>`
    <div class="file-item">
      <span>${f.file.name}</span>
      <span style="color:var(--muted)">${(f.file.size/1024/1024).toFixed(1)} MB</span>
    </div>
  `).join('');
}

$('start-btn').onclick=async()=>{
  if(!files.length) return;
  $('start-btn').disabled=true;
  $('error-display').style.display='none';
  $('gp-wrap').style.display='block';

  for(let i=0; i<files.length; i++){
    try {
      await processVideo(files[i], i+1, files.length);
    } catch(e) {
      $('error-display').style.display='block';
      $('error-display').innerHTML=`<b>Errore sul file ${i+1}:</b> ${e.message}`;
      console.error(e);
      break;
    }
  }
  $('start-btn').disabled=false;
};

async function processVideo(item, index, total) {
  const zoom = parseInt($('zoom-slider').value)/100;
  const url = URL.createObjectURL(item.file);
  video.src = url;

  $('gp-log').textContent = "Caricamento metadati...";
  await new Promise((res, rej) => {
    video.onloadedmetadata = res;
    video.onerror = () => rej(new Error("Video non leggibile dal browser."));
    setTimeout(()=>rej(new Error("Timeout caricamento video.")), 10000);
  });

  const w = video.videoWidth, h = video.videoHeight, dur = video.duration;
  
  // Downscale obbligatorio per stabilità se troppo grande
  let outW = w > 1920 ? 1920 : w;
  let outH = Math.round((outW / w) * h);
  outW = outW % 2 === 0 ? outW : outW - 1;
  outH = outH % 2 === 0 ? outH : outH - 1;
  
  canvas.width = outW;
  canvas.height = outH;

  const targetBitrate = Math.floor((9 * 1024 * 1024 * 8) / dur);
  
  const muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: { codec: 'avc', width: outW, height: outH },
    fastStart: 'in-memory'
  });

  const encoder = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: e => { throw new Error("Hardware Encoder: " + e.message); }
  });

  // Configurazione ultra-compatibile
  const config = {
    codec: 'avc1.42E01F', // Baseline profile per massima compatibilità
    width: outW,
    height: outH,
    bitrate: Math.min(targetBitrate, 5000000),
    framerate: 30
  };

  const check = await VideoEncoder.isConfigSupported(config);
  if (!check.supported) throw new Error("Il tuo PC non supporta questa risoluzione video.");

  encoder.configure(config);

  const fps = 30;
  const totalFrames = Math.floor(dur * fps);

  for (let f = 0; f < totalFrames; f++) {
    const time = f / fps;
    
    // Sincronizzazione frame
    await new Promise(res => {
      video.onseeked = res;
      video.currentTime = time;
      setTimeout(res, 500); // Watchdog
    });

    // Calcolo Crop
    const sW = w / zoom, sH = h / zoom;
    const sX = (w - sW) / 2, sY = (h - sH) / 2;

    ctx.drawImage(video, sX, sY, sW, sH, 0, 0, outW, outH);

    const frame = new VideoFrame(canvas, { 
      timestamp: Math.round(time * 1000000),
      duration: Math.round(1000000 / fps)
    });

    encoder.encode(frame, { keyFrame: f % 60 === 0 });
    frame.close();

    // Feedback UI
    if (f % 5 === 0) {
      const pct = Math.round((f / totalFrames) * 100);
      $('gp-fill').style.width = pct + '%';
      $('gp-pct').textContent = pct + '%';
      $('gp-log').textContent = `Elaborazione: ${f}/${totalFrames} frame\nBitrate: ${Math.round(config.bitrate/1000)} kbps`;
      await new Promise(r => setTimeout(r, 1)); // Yield per evitare freeze
    }
  }

  await encoder.flush();
  muxer.finalize();

  const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
  const dUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = dUrl;
  a.download = `tiktok_${item.file.name}`;
  a.click();

  URL.revokeObjectURL(url);
  $('gp-log').textContent = "Completato con successo!";
}
</script>
</body>
</html>
